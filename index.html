<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Tetris Sederhana</title>
    <style>
      :root {
        --bg: #0f172a;
        --panel: #111827;
        --panel-2: #1f2937;
        --grid: #374151;
        --text: #e5e7eb;
        --muted: #9ca3af;
        --accent: #22c55e;
        --danger: #ef4444;
        --shadow: rgba(0, 0, 0, 0.35);
      }

      * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        height: 100vh;
        font-family: Arial, Helvetica, sans-serif;
        background: linear-gradient(180deg, #020817 0%, #111827 100%);
        color: var(--text);
        overflow: hidden; /* Mencegah scrolling di HP */
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 8px;
      }

      .game-shell {
        width: min(100%, 480px);
        max-height: 100vh;
        background: rgba(17, 24, 39, 0.9);
        border: 1px solid rgba(148, 163, 184, 0.25);
        border-radius: 18px;
        box-shadow: 0 20px 40px var(--shadow);
        padding: 12px;
        display: flex;
        flex-direction: column;
      }

      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 8px;
      }

      h1 {
        font-size: clamp(1.1rem, 4vw, 1.6rem);
        margin: 0;
        letter-spacing: 1px;
      }

      .scorebox {
        display: flex;
        gap: 6px;
        justify-content: flex-end;
      }

      .chip {
        background: var(--panel-2);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 8px;
        padding: 4px 8px;
        min-width: 60px;
        text-align: center;
      }

      .chip span {
        display: block;
        font-size: 0.65rem;
        color: var(--muted);
      }

      .chip strong {
        font-size: 0.9rem;
      }

      .game-wrap {
        display: flex;
        gap: 12px;
        align-items: center;
        justify-content: center;
        flex: 1;
      }

      /* Kunci rasio canvas 1:2 agar gambar tidak gepeng */
      canvas {
        display: block;
        width: auto;
        max-width: 55vw;
        max-height: 60vh;
        aspect-ratio: 1 / 2;
        background: #0b1220;
        border: 2px solid rgba(148, 163, 184, 0.25);
        border-radius: 12px;
        box-shadow: inset 0 0 20px rgba(15, 23, 42, 0.8);
      }

      .side {
        flex: 1;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }

      .panel {
        background: rgba(15, 23, 42, 0.8);
        border: 1px solid rgba(148, 163, 184, 0.2);
        border-radius: 12px;
        padding: 8px;
      }

      .panel h2 {
        margin: 0 0 6px;
        font-size: 0.75rem;
        color: var(--muted);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .next-grid {
        width: 80px;
        height: 80px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        grid-template-rows: repeat(4, 1fr);
        gap: 2px;
        background: rgba(148, 163, 184, 0.08);
        border-radius: 8px;
        padding: 4px;
      }

      .next-grid div {
        background: rgba(148, 163, 184, 0.08);
        border-radius: 2px;
      }

      .controls {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 6px;
      }

      button {
        border: none;
        border-radius: 8px;
        background: linear-gradient(180deg, #374151 0%, #1f2937 100%);
        color: var(--text);
        font-weight: bold;
        padding: 10px 4px;
        font-size: 0.9rem;
        cursor: pointer;
        touch-action: manipulation;
        user-select: none;
      }

      button:active {
        transform: translateY(1px) scale(0.97);
      }

      .action-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 6px;
        margin-top: 6px;
      }

      .primary {
        background: linear-gradient(180deg, #16a34a 0%, #15803d 100%);
      }

      .danger {
        background: linear-gradient(180deg, #ef4444 0%, #b91c1c 100%);
      }

      .message {
        margin-top: 6px;
        text-align: center;
        color: var(--muted);
        font-size: 0.8rem;
      }

      /* Responsif khusus HP layar sempit/kecil */
      @media (max-width: 480px) {
        .game-wrap {
          flex-direction: row; /* Tetap berdampingan agar hemat ruang vertikal */
          align-items: center;
        }

        canvas {
          max-height: 55vh;
        }

        button {
          padding: 12px 2px;
        }
      }
    </style>
  </head>
  <body>
    <div class="game-shell">
      <div class="topbar">
        <h1>Tetris</h1>
        <div class="scorebox">
          <div class="chip"><span>Skor</span><strong id="score">0</strong></div>
          <div class="chip">
            <span>Baris</span><strong id="lines">0</strong>
          </div>
        </div>
      </div>

      <div class="game-wrap">
        <!-- Atribut width & height disesuaikan dengan grid 10x20 (30px/blok) -->
        <canvas
          id="game"
          width="300"
          height="600"
          aria-label="Area permainan Tetris"
        ></canvas>

        <div class="side">
          <div class="panel">
            <h2>Berikutnya</h2>
            <div id="next" class="next-grid" aria-live="polite"></div>
          </div>

          <div class="panel controls-panel">
            <h2>Kontrol</h2>
            <div class="controls">
              <button data-action="left">◀</button>
              <button data-action="rotate">⟳</button>
              <button data-action="right">▶</button>
              <button data-action="down">▼</button>
              <button data-action="drop" class="primary">Drop</button>
              <button data-action="pause" class="danger">Pause</button>
            </div>
            <div class="action-row">
              <button data-action="start">Mulai</button>
              <button data-action="restart">Ulang</button>
            </div>
          </div>
        </div>
      </div>

      <div id="message" class="message">Tekan Mulai untuk bermain</div>
    </div>

    <script>
      const COLS = 10;
      const ROWS = 20;
      const BLOCK = 30;
      const COLORS = {
        I: "#38bdf8",
        O: "#facc15",
        T: "#a78bfa",
        S: "#4ade80",
        Z: "#f87171",
        J: "#60a5fa",
        L: "#fb923c",
      };

      const SHAPES = {
        I: [[1, 1, 1, 1]],
        O: [
          [1, 1],
          [1, 1],
        ],
        T: [
          [0, 1, 0],
          [1, 1, 1],
        ],
        S: [
          [0, 1, 1],
          [1, 1, 0],
        ],
        Z: [
          [1, 1, 0],
          [0, 1, 1],
        ],
        J: [
          [1, 0, 0],
          [1, 1, 1],
        ],
        L: [
          [0, 0, 1],
          [1, 1, 1],
        ],
      };

      const canvas = document.getElementById("game");
      const ctx = canvas.getContext("2d");
      const nextEl = document.getElementById("next");
      const scoreEl = document.getElementById("score");
      const linesEl = document.getElementById("lines");
      const messageEl = document.getElementById("message");

      let board = [];
      let currentPiece = null;
      let nextPiece = null;
      let score = 0;
      let lines = 0;
      let level = 1;
      let dropInterval = 700;
      let lastTime = 0;
      let dropAccumulator = 0;
      let isRunning = false;
      let isPaused = false;
      let hasStarted = false;
      let animationId = null;

      function createBoard() {
        return Array.from({ length: ROWS }, () => Array(COLS).fill(null));
      }

      function randomPiece() {
        const keys = Object.keys(SHAPES);
        const key = keys[Math.floor(Math.random() * keys.length)];
        return {
          type: key,
          matrix: SHAPES[key].map((row) => [...row]),
          x: Math.floor((COLS - SHAPES[key][0].length) / 2),
          y: -1,
        };
      }

      function resetGame() {
        board = createBoard();
        score = 0;
        lines = 0;
        level = 1;
        dropInterval = 700;
        scoreEl.textContent = "0";
        linesEl.textContent = "0";
        currentPiece = null;
        nextPiece = randomPiece();
        spawnPiece();
        renderNext();
        updateMessage("Permainan dimulai!");
      }

      function spawnPiece() {
        currentPiece = nextPiece || randomPiece();
        currentPiece.x = Math.floor((COLS - currentPiece.matrix[0].length) / 2);
        currentPiece.y = -1;
        nextPiece = randomPiece();
        renderNext();

        if (collides(currentPiece, 0, 0)) {
          endGame();
        }
      }

      function collides(
        piece,
        offsetX = 0,
        offsetY = 0,
        matrix = piece.matrix,
      ) {
        for (let y = 0; y < matrix.length; y++) {
          for (let x = 0; x < matrix[y].length; x++) {
            if (!matrix[y][x]) continue;
            const newX = piece.x + x + offsetX;
            const newY = piece.y + y + offsetY;

            if (newX < 0 || newX >= COLS || newY >= ROWS) return true;
            if (newY >= 0 && board[newY][newX]) return true;
          }
        }
        return false;
      }

      function mergePiece() {
        for (let y = 0; y < currentPiece.matrix.length; y++) {
          for (let x = 0; x < currentPiece.matrix[y].length; x++) {
            if (!currentPiece.matrix[y][x]) continue;
            const boardY = currentPiece.y + y;
            const boardX = currentPiece.x + x;
            if (boardY >= 0) {
              board[boardY][boardX] = currentPiece.type;
            }
          }
        }
      }

      function clearLines() {
        let cleared = 0;

        for (let y = ROWS - 1; y >= 0; y--) {
          if (board[y].every((cell) => cell)) {
            board.splice(y, 1);
            board.unshift(Array(COLS).fill(null));
            cleared++;
            y++;
          }
        }

        if (cleared > 0) {
          lines += cleared;
          score += [0, 100, 300, 500, 800][cleared] * level;
          level = Math.floor(lines / 10) + 1;
          dropInterval = Math.max(120, 700 - (level - 1) * 60);
          scoreEl.textContent = String(score);
          linesEl.textContent = String(lines);
          updateMessage("Hore! " + cleared + " baris bersih.");
        }
      }

      function move(dx, dy) {
        if (!currentPiece || !isRunning || isPaused) return;

        if (!collides(currentPiece, dx, dy)) {
          currentPiece.x += dx;
          currentPiece.y += dy;
          render();
          return true;
        }

        if (dy > 0) {
          mergePiece();
          clearLines();
          spawnPiece();
          render();
        }
        return false;
      }

      function rotateMatrix(matrix) {
        return matrix[0].map((_, index) =>
          matrix.map((row) => row[index]).reverse(),
        );
      }

      function rotatePiece() {
        if (!currentPiece || !isRunning || isPaused) return;

        const rotated = rotateMatrix(currentPiece.matrix);
        const originalX = currentPiece.x;

        for (let offset = -1; offset <= 1; offset++) {
          currentPiece.x = originalX + offset;
          if (!collides(currentPiece, 0, 0, rotated)) {
            currentPiece.matrix = rotated;
            render();
            return;
          }
        }

        currentPiece.x = originalX;
      }

      function hardDrop() {
        if (!currentPiece || !isRunning || isPaused) return;

        while (!collides(currentPiece, 0, 1)) {
          currentPiece.y += 1;
        }
        mergePiece();
        clearLines();
        spawnPiece();
        render();
      }

      function endGame() {
        isRunning = false;
        updateMessage("Game Over! Tekan Ulang untuk mulai lagi.");
      }

      function updateMessage(text) {
        messageEl.textContent = text;
      }

      function drawCell(x, y, color) {
        ctx.fillStyle = color;
        ctx.fillRect(x * BLOCK, y * BLOCK, BLOCK, BLOCK);

        ctx.strokeStyle = "rgba(255,255,255,0.18)";
        ctx.strokeRect(x * BLOCK + 0.5, y * BLOCK + 0.5, BLOCK - 1, BLOCK - 1);
      }

      function drawBoard() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);

        for (let y = 0; y < ROWS; y++) {
          for (let x = 0; x < COLS; x++) {
            const value = board[y][x];
            if (value) {
              drawCell(x, y, COLORS[value]);
            } else {
              ctx.fillStyle = "#0b1220";
              ctx.fillRect(x * BLOCK, y * BLOCK, BLOCK, BLOCK);
              ctx.strokeStyle = "rgba(148,163,184,0.08)";
              ctx.strokeRect(
                x * BLOCK + 0.5,
                y * BLOCK + 0.5,
                BLOCK - 1,
                BLOCK - 1,
              );
            }
          }
        }
      }

      function drawPiece(piece) {
        if (!piece) return;
        piece.matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (!value) return;
            const drawX = piece.x + x;
            const drawY = piece.y + y;
            if (drawY >= 0) drawCell(drawX, drawY, COLORS[piece.type]);
          });
        });
      }

      function render() {
        drawBoard();
        if (currentPiece) drawPiece(currentPiece);
      }

      function renderNext() {
        nextEl.innerHTML = "";
        const cells = Array.from({ length: 16 }, () =>
          document.createElement("div"),
        );
        cells.forEach((cell) => nextEl.appendChild(cell));

        if (!nextPiece) return;

        const matrix = nextPiece.matrix;
        const offsetX = Math.floor((4 - matrix[0].length) / 2);
        const offsetY = Math.floor((4 - matrix.length) / 2);

        matrix.forEach((row, y) => {
          row.forEach((value, x) => {
            if (value) {
              const index = (y + offsetY) * 4 + (x + offsetX);
              const cell = cells[index];
              cell.style.background = COLORS[nextPiece.type];
              cell.style.borderRadius = "4px";
              cell.style.boxShadow = "inset 0 0 0 1px rgba(255,255,255,0.15)";
            }
          });
        });
      }

      function tick(time = 0) {
        if (!isRunning || isPaused) {
          animationId = requestAnimationFrame(tick);
          return;
        }

        const delta = time - lastTime;
        lastTime = time;
        dropAccumulator += delta;

        if (dropAccumulator >= dropInterval) {
          dropAccumulator = 0;
          move(0, 1);
        }

        animationId = requestAnimationFrame(tick);
      }

      function startGame() {
        if (!hasStarted) {
          resetGame();
          hasStarted = true;
        }
        isPaused = false;
        isRunning = true;
        lastTime = 0;
        dropAccumulator = 0;
        updateMessage("Bermain...");
        if (animationId) cancelAnimationFrame(animationId);
        animationId = requestAnimationFrame(tick);
      }

      function togglePause() {
        if (!hasStarted) return;
        isPaused = !isPaused;
        isRunning = !isPaused;
        updateMessage(isPaused ? "Jeda" : "Bermain...");
      }

      function restartGame() {
        hasStarted = true;
        resetGame();
        isPaused = false;
        isRunning = true;
        lastTime = 0;
        dropAccumulator = 0;
        if (animationId) cancelAnimationFrame(animationId);
        animationId = requestAnimationFrame(tick);
      }

      document.addEventListener("keydown", (event) => {
        if (event.key === "p" || event.key === "P") {
          togglePause();
          return;
        }

        if (!hasStarted || !isRunning || isPaused) {
          if (event.key === "Enter" || event.key === " ") {
            startGame();
          }
          return;
        }

        switch (event.key) {
          case "ArrowLeft":
          case "a":
          case "A":
            move(-1, 0);
            break;
          case "ArrowRight":
          case "d":
          case "D":
            move(1, 0);
            break;
          case "ArrowDown":
          case "s":
          case "S":
            move(0, 1);
            break;
          case "ArrowUp":
          case "w":
          case "W":
            rotatePiece();
            break;
          case " ":
            hardDrop();
            break;
          default:
            break;
        }
      });

      document.querySelectorAll("[data-action]").forEach((button) => {
        const handleAction = (e) => {
          e.preventDefault(); // Mencegah zoom/scroll tidak sengaja di mobile
          const action = button.dataset.action;
          switch (action) {
            case "left":
              move(-1, 0);
              break;
            case "right":
              move(1, 0);
              break;
            case "down":
              move(0, 1);
              break;
            case "rotate":
              rotatePiece();
              break;
            case "drop":
              hardDrop();
              break;
            case "pause":
              togglePause();
              break;
            case "start":
              startGame();
              break;
            case "restart":
              restartGame();
              break;
            default:
              break;
          }
        };

        button.addEventListener("touchstart", handleAction, { passive: false });
        button.addEventListener("click", handleAction);
      });

      document.addEventListener(
        "touchstart",
        (event) => {
          if (event.target.closest("button")) return;
          const touch = event.changedTouches[0];
          if (!touch) return;
          const startX = touch.clientX;
          const startY = touch.clientY;

          const onTouchEnd = (endEvent) => {
            const endTouch = endEvent.changedTouches[0];
            const dx = endTouch.clientX - startX;
            const dy = endTouch.clientY - startY;

            if (Math.abs(dx) > Math.abs(dy)) {
              if (dx > 30) move(1, 0);
              else if (dx < -30) move(-1, 0);
            } else {
              if (dy > 30) {
                move(0, 1);
              } else if (dy < -30) {
                rotatePiece();
              }
            }

            document.removeEventListener("touchend", onTouchEnd);
          };

          document.addEventListener("touchend", onTouchEnd, { once: true });
        },
        { passive: true },
      );

      resetGame();
      render();
      updateMessage("Tekan Mulai untuk bermain");
      isRunning = false;
      hasStarted = false;
    </script>
  </body>
</html>
